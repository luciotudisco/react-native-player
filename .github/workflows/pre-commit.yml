name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.x
      - name: Install Packages
        run: npm install
      - name: Check Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --coverage
